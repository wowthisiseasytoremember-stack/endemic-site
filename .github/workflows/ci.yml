name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.21.0'
        cache: 'npm'
        
    - name: Toolchain
      run: node --version && npm --version

    - name: Lock repair diagnostics
      run: |
        npm view @emnapi/runtime@1.11.3 version dist.tarball dist.integrity license dependencies optionalDependencies peerDependencies engines --json
        npm view @emnapi/core@1.11.3 version dist.tarball dist.integrity license dependencies optionalDependencies peerDependencies engines --json
        npm view @emnapi/wasi-threads@1.2.3 version dist.tarball dist.integrity license dependencies optionalDependencies peerDependencies engines --json

    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Typecheck
      run: npm run typecheck
      
    - name: Build
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
