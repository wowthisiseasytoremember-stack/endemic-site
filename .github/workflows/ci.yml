name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.21.0'
        cache: 'npm'
        
    - name: Toolchain
      run: node --version && npm --version

    - name: Install dependencies
      run: npm ci
      
    - name: Verify publication artifact
      run: npm run data:publication:check

    - name: Verify product-proof media manifest
      run: npm run data:product-proof-media:check

    - name: Lint
      run: npm run lint
      
    - name: Typecheck
      run: npm run typecheck
      
    - name: Build
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
